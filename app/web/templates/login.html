{% extends "base.html" %} {% set hide_nav = true %} {% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-card__header">
      <h1 class="login-card__title">Ingresar</h1>
      <p class="login-card__subtitle">Selecciona tu compañía e inicia sesión</p>
    </div>
    <div class="login-card__body">
      {% if error %}
      <div class="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="form-row">
          <div class="label">Usuario</div>
          <input
            class="input"
            name="username"
            autocomplete="username"
            autofocus
          />
        </div>

        <div class="form-row">
          <div class="label">Contraseña</div>
          <input
            class="input"
            type="password"
            name="password"
            autocomplete="current-password"
          />
        </div>

        <div class="form-row">
          <div class="label">Compañía</div>
          <select class="input" name="company_code">
            {% for c in companies %}
            <option
              value="{{ c.empre_codigo }}"
              {%
              if
              c.empre_actual
              %}selected{%
              endif
              %}
            >
              {{ c.empre_nombre }} ({{ c.empre_codigo }})
            </option>
            {% endfor %}
          </select>
        </div>

        <button class="btn" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
